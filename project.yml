name: Vitals
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  VitalsKit:
    path: Packages/VitalsKit
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ETR554P9HN
    CODE_SIGN_STYLE: Automatic
targets:
  Vitals:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["Shortcuts/**", "Shortcuts"]
      # Signed Relief shortcuts, built by shortcuts/build.sh; kept as a folder so they land in Vitals.app/Shortcuts/.
      - path: App/Resources/Shortcuts
        type: folder
        buildPhase: resources
      # The App Intent behind "Run check-up" and the Live Activity attributes, shared with the widget extension.
      - Shared
    dependencies:
      - package: VitalsKit
        product: VitalsKit
      - package: VitalsKit
        product: VitalsDesign
      - target: VitalsWidgets
      - target: VitalsShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vitals Check-up
        CFBundleName: Vitals Check-up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Background refresh takes a timeline sample (Sampling/BackgroundSampler.swift).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [sg.com.vitals.app.sample]
        # "Watch my phone" monitoring session on the Lock Screen and in the Dynamic Island. Updated locally, no push server.
        NSSupportsLiveActivities: true
        # Widgets and the control open vitals://checkup, vitals://heat, vitals://battery, vitals://storage, vitals://scan.
        CFBundleURLTypes:
          - CFBundleURLName: sg.com.vitals.app
            CFBundleURLSchemes: [vitals]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        # No orientation lock: iPhone Duo's inner display and rotation both work.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        # "Open in Vitals" for shared system files. Large archives are streamed, never loaded whole.
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS system report
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [sg.com.vitals.ips, sg.com.vitals.analytics]
          - CFBundleTypeName: Sysdiagnose archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.gnu.gnu-zip-tar-archive, org.gnu.gnu-zip-archive]
          - CFBundleTypeName: Vitals companion capture
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [sg.com.vitals.capture]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: sg.com.vitals.ips
            UTTypeDescription: iOS diagnostic report
            UTTypeConformsTo: [public.data, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [ips]
          - UTTypeIdentifier: sg.com.vitals.analytics
            UTTypeDescription: iOS analytics data
            UTTypeConformsTo: [public.data, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [synced]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: sg.com.vitals.capture
            UTTypeDescription: Vitals companion capture
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vitalscapture]
        NSCameraUsageDescription: "The camera test shows each lens so you can check it focuses and is clean. Nothing is saved."
        NSMicrophoneUsageDescription: "The microphone test records a few seconds and plays it back so you can hear each mic. The recording is deleted straight away."
        NSBluetoothAlwaysUsageDescription: "The Bluetooth test scans for nearby devices to check the radio works. Nothing is connected or stored."
        NSLocationWhenInUseUsageDescription: "The GPS test gets one location fix to check accuracy. The location is shown to you and never stored."
        NSFaceIDUsageDescription: "The Face ID test asks Face ID to recognise you, to check the sensor works. Vitals never sees your face data."
        NSMotionUsageDescription: "The motion test shows live readings from the accelerometer, gyroscope, compass and barometer."
        NFCReaderUsageDescription: "The NFC test starts a reader session to check the NFC chip responds."
        NSPhotoLibraryUsageDescription: "Photos clean-up looks through your library on this phone to suggest duplicates, old screenshots and large videos to delete. Nothing leaves the phone, and nothing is deleted until you confirm."
        # Relief shortcuts run through the public shortcuts:// URL (plan §5.14a).
        LSApplicationQueriesSchemes: [shortcuts]
    entitlements:
      path: App/Vitals.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.com.vitals.app]
        com.apple.developer.nfc.readersession.formats: [TAG]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.com.vitals.app
        PRODUCT_NAME: Vitals
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  VitalsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - Shared
    dependencies:
      - package: VitalsKit
        product: VitalsKit
      - package: VitalsKit
        product: VitalsDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Vitals Check-up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/VitalsWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.com.vitals.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.com.vitals.app.widgets
        PRODUCT_NAME: VitalsWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  VitalsShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension/Sources
    dependencies:
      - package: VitalsKit
        product: VitalsKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Vitals Check-up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Any file: the app works out what it is (FileSniffer). Text-only shares are ignored.
            NSExtensionActivationRule: "SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.data\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.file-url\").@count >= 1).@count >= 1"
    entitlements:
      path: ShareExtension/VitalsShare.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.com.vitals.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.com.vitals.app.share
        PRODUCT_NAME: VitalsShare
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  # Mac companion (GPL-3.0-or-later, companion/LICENSE). Runs the Python engine; the downloadable build bundles
  # Python and pymobiledevice3 (companion/packaging/make-release.sh). Not sandboxed: it launches Python and talks to USB devices.
  VitalsCompanion:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - companion/MacApp
      - path: companion/engine/vitals_companion
        buildPhase: resources
        type: folder
        destinationFilters: []
    dependencies:
      - package: VitalsKit
        product: VitalsKit
      - package: VitalsKit
        product: VitalsDesign
    info:
      path: companion/MacApp/Info.plist
      properties:
        CFBundleDisplayName: Vitals Companion
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.com.vitals.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Vitals Companion
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vitals:
    build:
      targets:
        Vitals: all
    test:
      targets:
        - package: VitalsKit/VitalsKitTests
